<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Böngészős krimi 1931-ből: egy halott báró, öt gyanúsított, négy rejtvény.">
<title>Gyilkosság a Szegfű-villában</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500;1,6..96,700&family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap">
<style>
*{box-sizing:border-box}
body{margin:0}

/* Layout: egy rendőrségi ügyirat-mappa — füles mappa-navigáció, gépelt lapok, piros bélyegzők */
:root{
  --bg:#ddcfa6; --paper:#f4ecd6; --paper2:#ebe0c1; --ink:#1e2740; --muted:#5f6378;
  --line:#c5b386; --stamp:#a3262c; --accent:#22534a; --accent-fg:#f4ecd6; --good:#2d6a3e;
  --display:"Bodoni Moda", Didot, "Times New Roman", serif;
  --type:"Courier Prime", "Courier New", monospace;
  --body:"Crimson Pro", Georgia, serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --paper:#1c212b; --paper2:#232935; --ink:#e8e0c9; --muted:#9ba1b3;
  --line:#323a49; --stamp:#e2595e; --accent:#74b6a1; --accent-fg:#12151c; --good:#7cc68e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --paper:#1c212b; --paper2:#232935; --ink:#e8e0c9; --muted:#9ba1b3;
  --line:#323a49; --stamp:#e2595e; --accent:#74b6a1; --accent-fg:#12151c; --good:#7cc68e; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:0}
header.case{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;padding-block:8px 18px}
header.case h1{font-family:var(--display);font-style:italic;font-weight:700;font-size:clamp(30px,6vw,52px);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.01em}
header.case .meta{font-family:var(--type);font-size:13px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.stamp{font-family:var(--type);font-weight:700;color:var(--stamp);border:2.5px solid var(--stamp);border-radius:4px;padding:3px 10px;
  letter-spacing:.14em;text-transform:uppercase;display:inline-block;transform:rotate(-4deg);font-size:14px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{font-family:var(--type);font-size:14px;letter-spacing:.04em;background:var(--paper2);color:var(--muted);border:1px solid var(--line);
  border-bottom:none;border-radius:10px 10px 0 0;padding:9px 16px 8px;cursor:pointer;white-space:nowrap;position:relative;top:1px}
nav.tabs button[aria-selected="true"]{background:var(--paper);color:var(--ink);font-weight:700;z-index:1}
nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.tabs .count{display:inline-block;min-width:20px;margin-left:6px;padding:0 5px;border-radius:9px;background:var(--stamp);color:var(--paper);font-size:12px;text-align:center}
main{background:var(--paper);border:1px solid var(--line);border-radius:0 6px 6px 6px;padding:clamp(18px,4vw,36px);min-height:420px;
  box-shadow:0 1px 0 var(--line),0 14px 30px -18px rgba(0,0,0,.35)}
h2{font-family:var(--display);font-weight:700;font-size:28px;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h3{font-family:var(--display);font-weight:700;font-size:21px;margin:0;text-wrap:balance}
.eyebrow{font-family:var(--type);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:65ch}
.stack{display:flex;flex-direction:column;gap:16px}
.typed{font-family:var(--type);font-size:15.5px;line-height:1.6;background:var(--paper2);border:1px solid var(--line);padding:16px 18px;white-space:pre-wrap;border-radius:2px}
.lead{font-size:20px}
.btn{font-family:var(--type);font-weight:700;font-size:15px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:3px;padding:10px 18px;cursor:pointer;letter-spacing:.03em}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.loc{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--paper2);border:1px solid var(--line);padding:16px;border-radius:3px;cursor:pointer;color:var(--ink);font:inherit}
.loc:hover{border-color:var(--ink)}
.loc .status{font-family:var(--type);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.loc .status.done{color:var(--good)}
.loc .status.locked{color:var(--stamp)}
.loc[disabled]{cursor:not-allowed;opacity:.6}
.back{font-family:var(--type);background:none;border:none;color:var(--accent);cursor:pointer;padding:0;font-size:14px;align-self:flex-start}
.item{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:8px}
.item .row button{font-size:13px;padding:7px 12px}
.found{font-family:var(--type);font-size:12px;color:var(--good);letter-spacing:.1em;text-transform:uppercase}
.msg{font-family:var(--type);font-size:14px;min-height:1.4em}
.msg.bad{color:var(--stamp)} .msg.ok{color:var(--good)}
.digits{display:flex;gap:8px}
.digits input{width:52px;height:64px;text-align:center;font-family:var(--type);font-size:30px;font-weight:700;background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:4px}
.samples{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sample{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);padding:12px;border-radius:3px;cursor:pointer;background:var(--paper2)}
.sample:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.sample .typed{background:var(--paper);padding:10px 12px;font-size:15px}
.r{position:relative;top:-.28em}
.f{opacity:.35}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
td,th{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;vertical-align:middle}
th{font-family:var(--type);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:400}
select{font-family:var(--type);font-size:15px;padding:7px 8px;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:3px;max-width:100%}
ol.facts{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.dial{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dial .num{font-family:var(--type);font-size:34px;font-weight:700;width:2.2ch;text-align:center;font-variant-numeric:tabular-nums}
.dial input[type=range]{flex:1;min-width:180px;accent-color:var(--accent)}
.cipher{font-family:var(--type);font-size:18px;letter-spacing:.12em;line-height:1.7;word-break:break-word}
.suspect{display:flex;flex-direction:column;gap:8px;background:var(--paper2);border:1px solid var(--line);padding:16px;border-radius:3px;position:relative;min-width:0}
.suspect .role{font-family:var(--type);font-size:13px;color:var(--muted)}
.suspect .note{font-family:var(--type);font-size:14px;border-left:3px solid var(--stamp);padding-left:10px}
.suspect .stamp{position:absolute;top:12px;right:12px;font-size:12px}
.clue{display:flex;flex-direction:column;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:14px}
.clue:last-child{border-bottom:none}
.clue h3{font-size:18px}
.clue .src{font-family:var(--type);font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.progress{display:flex;gap:6px;flex-wrap:wrap}
.pip{font-family:var(--type);font-size:12px;padding:3px 9px;border:1px solid var(--line);border-radius:12px;color:var(--muted)}
.pip.done{border-color:var(--good);color:var(--good)}
fieldset{border:1px solid var(--line);border-radius:3px;padding:12px 14px;margin:0;display:flex;flex-direction:column;gap:8px}
legend{font-family:var(--type);font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:0 6px;color:var(--muted)}
label.opt{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.ending{border:2px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:12px}
.ending.win{border-color:var(--good)}
footer{font-family:var(--type);font-size:12px;color:var(--muted);text-align:center;padding-top:16px;display:flex;justify-content:center;gap:16px;flex-wrap:wrap}
footer button{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion: no-preference){
  .stamp.anim{animation:thump .35s ease-out}
  @keyframes thump{0%{transform:rotate(-4deg) scale(1.6);opacity:0}100%{transform:rotate(-4deg) scale(1);opacity:1}}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="case">
    <div class="stack" style="gap:6px">
      <span class="meta">Balatonfüred · 1931. október 9. · Ügyszám 1931/417</span>
      <h1>Gyilkosság a Szegfű-villában</h1>
    </div>
    <span class="stamp" id="caseStamp">Nyomozás folyamatban</span>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view" aria-live="polite"></main>
  <footer><span>Egy kis krimi Agatha Christie modorában.</span><button id="reset">Új játék</button></footer>
</div>

<script>
const ROOMS=["Szalon","Konyha","Üvegház","Emeleti szobák","Könyvtár"];
const SUSPECTS=[
 {id:"matild",name:"Kendeffy Matild",role:"Az özvegy, 29 éves. A báró második felesége.",
  stmt:"„Délután összevesztünk Auréllal. Egész este be sem tettem a lábam a könyvtárba. Fájt a fejem, fent voltam.”",
  extra:{after:"alibi",text:"Az emeleten volt — és egész este nem hallott írógép-kopogást."}},
 {id:"gabor",name:"Kendeffy Gábor",role:"Az unokaöcs, 34 éves. Az örökség fő várományosa.",
  stmt:"„Zongoráztam a szalonban, Chopint. Mindenki hallhatta. Igen, tartozom néhány embernek, de ettől még nem vagyok gyilkos.”",
  extra:{after:"zalog",text:"A zálogcédulák szerint súlyos adósságai vannak. Indíték — de az alibije szilárd."}},
 {id:"szirmai",name:"Dr. Szirmai Ottó",role:"Háziorvos, 52 éves. Régi barát.",
  stmt:"„Kint szivaroztam az üvegháznál. Matild asszony nem tűri a füstöt a házban. A kertész látott, kérdezze csak meg.”",
  extra:{after:"taska",text:"Táskájából hiányzik egy morfiumampulla. Ideges, valamit titkol — de méreg nincs nála."}},
 {id:"ilona",name:"Bakos Ilona",role:"A báró titkárnője, 31 éves. Négy éve kezeli a gyűjtemény papírjait.",
  stmt:"„Fent gépeltem a dolgozószobámban egész este. A báró úr leveleit tisztáztam le.”",
  extra:{after:"alibi",text:"HAZUDOTT: a helyiségbeosztás szerint a könyvtárban volt, nem fent.",lie:true}},
 {id:"lukacs",name:"Lukács János",role:"Komornyik, 61 éves. Harminc éve szolgálja a családot.",
  stmt:"„A konyhában tisztítottam az ezüstöt, Teréz, a szakácsné végig ott volt. A báró úr minden este pontban tízkor iszik egy pohár konyakot a könyvtárban. Én töltöttem ki fél tízkor, ahogy mindig.”",
  extra:null}
];
const CLUES={
 holttest:{t:"Keserűmandula-szag",src:"Könyvtár",x:"A báró a karosszékben ült, előtte a félig kiürült konyakospohár. A pohárból enyhe keserűmandula-szag árad. Dr. Szirmai szerint ciánmérgezés, a halál azonnal beállt, 22:00 körül."},
 telefon:{t:"Telefonbeszélgetés",src:"Hall",x:"A posta központja igazolja: a báró 21:30 és 21:55 között a halli telefonon Budapesttel beszélt. A konyakot tehát ebben az időben, üres könyvtárban mérgezték meg."},
 taska:{t:"Az orvosi táska",src:"Hall",x:"Dr. Szirmai táskájából hiányzik egy morfiumampulla. Cián vagy cianidtartalmú szer viszont nincs benne és a nyilvántartásában sem szerepel."},
 zalog:{t:"Zálogcédulák",src:"Vendégszoba",x:"Gábor kabátzsebében három budapesti zálogcédula: aranyóra, mandzsettagombok, egy cigarettatárca. Nagyon kell neki a pénz."},
 levelk:{t:"Szerelmes levél",src:"Emeleti szobák",x:"Matild fiókjában egy aláíratlan, rajongó hangú levél egy budapesti festőtől. Matildnak titka van — de a levél szerint épp el akart válni, nem gyilkolni."},
 darazs:{t:"Az üvegházi darázsirtó",src:"Üvegház",x:"A harmadik polcon álló „Darázsirtó — MÉREG” feliratú bádogdoboz (kálium-cianid) fedele lazán áll, a porban friss nyom: valaki a minap kinyitotta. A polc előtt keskeny, magas sarkú női cipő lenyomata."},
 level:{t:"A báró el nem küldött levele",src:"Könyvtár · íróasztal",x:"„Tekintetes Rendőrkapitányság! Gyűjteményem öt festményét az elmúlt két évben hamisítványokra cserélték, az eredetieket eladták. Az eladási nyugták a házban, egy irodai írógépen készültek. Holnap, október 10-én személyesen megnevezem a tettest. — Kendeffy Aurél”"},
 gep:{t:"A hamis nyugta írógépe",src:"Titkárság",x:"A Munkácsy-festmény hamis eladási nyugtája a titkárság Remington írógépén készült: az „é” helyett „e”-t üt, és az „a” betű kissé felcsúszik. Ezt a gépet Bakos Ilona használja."},
 alibi:{t:"Ki hol volt 21:30 és 21:45 között?",src:"Szalon · tanúvallomások",x:"Lukács: konyha. Dr. Szirmai: üvegház. Gábor: szalon (zongora). Matild: emelet. Bakos Ilona: könyvtár — pedig azt állította, fent gépelt."},
 jegyzet:{t:"Ilona titkosított jegyzete",src:"Ilona szobája",x:"Kódolva, 7-es eltolással: „ÜVEGHÁZ, HARMADIK POLC. KONYAK HÁROMNEGYED TÍZ ELŐTT.” — Ilona előre megtervezte, honnan veszi a mérget és mikor teszi a pohárba."}
};
const PUZZLES={desk:"Az íróasztal számzára",type:"Az írógépek",alibi:"A vallomások",cipher:"A titkosírás"};
const LOCS=[
 {id:"konyvtar",name:"Könyvtár",desc:"Bőrfotelek, tölgyfa polcok, odakint vihar. A báró itt halt meg.",
  items:[{clue:"holttest",label:"A holttest és a pohár",text:"A báró a karosszékben ül, mintha elaludt volna. A kisasztalon egy metszett konyakospohár."}],puzzle:"desk"},
 {id:"hall",name:"Hall",desc:"Márványpadló, állóóra, a falon a ház egyetlen telefonja.",
  items:[{clue:"telefon",label:"A telefon",text:"A postai központ kezelőnője emlékszik, mikor kapcsolta a bárót."},
         {clue:"taska",label:"Dr. Szirmai táskája",text:"Az orvos fekete bőrtáskája a fogason lóg."}]},
 {id:"titkarsag",name:"Titkárság",desc:"Szűk iroda a földszinten, iratszekrények és egy nehéz Remington.",requires:"desk",lockMsg:"Előbb nyisd ki a báró íróasztalát — ott van az a papír, amit itt össze kell vetni.",puzzle:"type"},
 {id:"szalon",name:"Szalon",desc:"Itt gyűltek össze a vendégek a rendőrség érkezése előtt. A zongora fedele nyitva.",puzzle:"alibi"},
 {id:"emelet",name:"Emeleti szobák",desc:"Hálószobák és a titkárnő kis dolgozószobája.",
  items:[{clue:"levelk",label:"Matild fiókja",text:"Egy illatosított boríték a fehérnemű alatt."}],puzzle:"cipher"},
 {id:"vendeg",name:"Vendégszoba",desc:"Gábor szobája, gyűrött ágy, a széken egy kabát.",
  items:[{clue:"zalog",label:"Gábor kabátja",text:"A belső zsebből papírok kandikálnak ki."}]},
 {id:"uveghaz",name:"Üvegház",desc:"Párás meleg, orchideák, a sarokban kerti szerszámok és vegyszerek.",
  items:[{clue:"darazs",label:"A vegyszerespolc",text:"Bádogdobozok, permetezők, a harmadik polcon egy koponyás címke."}]}
];
const PLAIN="UVEGHAZ, HARMADIK POLC. KONYAK HAROMNEGYED TIZ ELOTT.";
const SHIFT=7;
const shiftTxt=(s,k)=>s.replace(/[A-Z]/g,c=>String.fromCharCode((c.charCodeAt(0)-65+k+26)%26+65));
const CIPHER=shiftTxt(PLAIN,SHIFT);

const KEY="szegfu-villa-v1";
let S=load();
function fresh(){return{tab:"ugy",loc:null,clues:[],solved:{},alibi:{},dial:0,tries:0,ended:null}}
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v&&v.clues)return Object.assign(fresh(),v)}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function gain(id){if(!S.clues.includes(id))S.clues.push(id)}
function solve(p,clue){S.solved[p]=true;gain(clue);save()}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $=s=>document.querySelector(s);

const TABS=[["ugy","Ügyirat"],["hely","Helyszínek"],["gyan","Gyanúsítottak"],["jegy","Jegyzetfüzet"],["vad","Vádemelés"]];
function renderTabs(){
  $("#tabs").innerHTML=TABS.map(([id,l])=>`<button role="tab" aria-selected="${S.tab===id}" data-tab="${id}">${l}${id==="jegy"&&S.clues.length?`<span class="count">${S.clues.length}</span>`:""}</button>`).join("");
  $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.loc=null;save();render()});
}
function render(){
  renderTabs();
  const st=$("#caseStamp");
  st.textContent=S.ended==="win"?"Ügy lezárva":"Nyomozás folyamatban";
  const v=$("#view");
  v.innerHTML=({ugy:vUgy,hely:vHely,gyan:vGyan,jegy:vJegy,vad:vVad})[S.tab]();
  bind[S.tab]&&bind[S.tab]();
}

function progressPips(){return `<div class="progress">${Object.entries(PUZZLES).map(([k,n])=>`<span class="pip ${S.solved[k]?"done":""}">${S.solved[k]?"✓ ":""}${n}</span>`).join("")}</div>`}

function vUgy(){return `<div class="stack">
 <span class="eyebrow">Bizalmas · a vármegyei rendőrkapitányság részére</span>
 <h2>Kendeffy Aurél báró halála</h2>
 <p class="lead">1931. október 9-én, péntek este tíz órakor Kendeffy Aurél bárót holtan találták balatonfüredi villájának könyvtárában. Odakint vihar tombolt, az utat a fák elzárták: a házból senki sem távozhatott.</p>
 <p>Téged, a fővárosból épp a villában vendégeskedő magánnyomozót kérik fel, hogy reggelig, a csendőrök megérkezéséig derítsd ki az igazságot. Öt ember tartózkodott a házban. Egyikük gyilkos.</p>
 <div class="typed">TEENDŐ:
1. Járd végig a helyszíneket, gyűjts nyomokat.
2. Oldd meg a négy rejtvényt — mindegyik döntő bizonyítékot ad.
3. Hallgasd meg a gyanúsítottakat.
4. Nevezd meg a tettest, az eszközt és az indítékot.</div>
 ${progressPips()}
 <div class="row"><button class="btn" data-go="hely">Helyszínelés indítása →</button></div>
</div>`}

function vHely(){
  if(S.loc)return vLoc(LOCS.find(l=>l.id===S.loc));
  return `<div class="stack"><span class="eyebrow">A villa alaprajza</span><h2>Helyszínek</h2>
  <p>Válassz egy helyiséget. A rejtvényt rejtő helyszíneket ✦ jelöli.</p>
  <div class="grid2">${LOCS.map(l=>{
    const locked=l.requires&&!S.solved[l.requires];
    const total=(l.items||[]).length+(l.puzzle?1:0);
    const got=(l.items||[]).filter(i=>S.clues.includes(i.clue)).length+(l.puzzle&&S.solved[l.puzzle]?1:0);
    const status=locked?`<span class="status locked">Zárva</span>`:got===total?`<span class="status done">Átkutatva</span>`:`<span class="status">${got}/${total} felderítve</span>`;
    return `<button class="loc" data-loc="${l.id}" ${locked?"disabled":""}><h3>${l.puzzle?"✦ ":""}${l.name}</h3><p>${l.desc}</p>${status}</button>`}).join("")}</div></div>`}

function vLoc(l){
  let h=`<div class="stack"><button class="back" data-back>← Vissza az alaprajzhoz</button><span class="eyebrow">Helyszín</span><h2>${l.name}</h2><p>${l.desc}</p>`;
  (l.items||[]).forEach(it=>{const has=S.clues.includes(it.clue);
    h+=`<div class="item"><h3>${it.label}</h3><p>${it.text}</p>${has?`<span class="found">✓ Nyom feljegyezve: ${CLUES[it.clue].t}</span><p class="typed">${esc(CLUES[it.clue].x)}</p>`:`<div class="row"><button class="btn ghost" data-take="${it.clue}">Megvizsgálom</button></div>`}</div>`});
  if(l.puzzle)h+=`<div class="item">${PZ[l.puzzle]()}</div>`;
  return h+`</div>`}

const PZ={
 desk(){const done=S.solved.desk;return `<h3>✦ ${PUZZLES.desk}</h3>
  <p>A báró íróasztalának fiókja négyjegyű számzárral nyílik. Lukács, a komornyik szerint a gazdája minden zárat „a legboldogabb napjára” állított.</p>
  <p>Az asztalon bekeretezett fénykép: egy fiatal pár galambok között. A hátoldalára írva:</p>
  <div class="typed">Velence, Szent Márk tér, 1919. V. 14.
A legboldogabb napom. — A. & K.</div>
  ${done?`<span class="found">✓ A fiók kinyílt</span><p class="typed">${esc(CLUES.level.x)}</p><p>A levél alatt egy gépelt adásvételi nyugta is lapul. Érdemes lenne összevetni a ház írógépeivel — a titkárság most már nyitva áll.</p>`
  :`<div class="digits">${[0,1,2,3].map(i=>`<input id="d${i}" inputmode="numeric" maxlength="1" aria-label="${i+1}. számjegy">`).join("")}</div>
  <div class="row"><button class="btn" id="deskTry">Kipróbálom</button><button class="btn ghost" id="deskHint">Súgó</button></div><p class="msg" id="deskMsg"></p>`}`},
 type(){const done=S.solved.type;
  const smp=[["A","A könyvtár Underwoodja (a báróé)",`A v<span>e</span>tel<span>á</span>rat k<span>e</span>szp<span>e</span>nzben <span>á</span>tvettem.`],
             ["B","A vendégszobai hordozható gép (Gáboré)",`<span class="r">A</span> vételár<span class="r">a</span>t készpénzben átvettem.`],
             ["C","A titkárság Remingtonja",`<span class="r">A</span> vetelár<span class="r">a</span>t k<span>e</span>szp<span>e</span>nzben átvettem.`]];
  return `<h3>✦ ${PUZZLES.type}</h3>
  <p>A báró fiókjában talált nyugta szerint a Munkácsy-képet „eladták”. A gépelés jellegzetes: nézd meg alaposan a betűket. Melyik gépen készült?</p>
  <div class="typed">ADÁSVETELI NYUGTA
Munkácsy M.: Poros út, ol<span class="r">a</span>j, vászon.
<span class="r">A</span> vetelár<span class="r">a</span>t, 14 000 pengőt keszpenzben átvettem.
Bud<span class="r">a</span>pest, 1931. VI. 2.</div>
  <div class="samples">${smp.map(([k,n,t])=>`<label class="sample"><span class="row"><input type="radio" name="tw" value="${k}" ${done&&k==="C"?"checked":""}> <b>${k}</b> · ${n}</span><div class="typed">${t}</div></label>`).join("")}</div>
  ${done?`<span class="found">✓ Azonosítva</span><p class="typed">${esc(CLUES.gep.x)}</p>`:`<div class="row"><button class="btn" id="twTry">Ez a gép</button></div><p class="msg" id="twMsg"></p>`}`},
 alibi(){const done=S.solved.alibi;
  return `<h3>✦ ${PUZZLES.alibi}</h3>
  <p>A konyakot 21:30 és 21:45 között mérgezték meg. Ekkor mind az öten más-más helyiségben voltak. A vallomásokból és a tanúk szavaiból állítsd össze, ki hol volt.</p>
  <ol class="facts">
   <li>Teréz, a szakácsné szerint Lukács egész idő alatt mellette tisztította az ezüstöt.</li>
   <li>A kertész az ablakból látta, ahogy valaki az üvegháznál szivarozik. A házban senki sem gyújthatott rá.</li>
   <li>Dr. Szirmai az egyetlen dohányos a vendégek közül.</li>
   <li>A szalonban egyetlen ember volt, aki végig Chopint játszott.</li>
   <li>Matild nem tud zongorázni, és délután óta nem lépett be a könyvtárba.</li>
   <li>Bakos Ilona soha életében nem tanult zongorázni.</li>
  </ol>
  <div class="tablewrap"><table><thead><tr><th>Gyanúsított</th><th>Helyiség 21:30–21:45</th></tr></thead><tbody>
  ${SUSPECTS.map(s=>`<tr><td>${s.name}</td><td><select id="al-${s.id}" data-al="${s.id}" ${done?"disabled":""}><option value="">— válassz —</option>${ROOMS.map(r=>`<option ${S.alibi[s.id]===r?"selected":""}>${r}</option>`).join("")}</select></td></tr>`).join("")}
  </tbody></table></div>
  ${done?`<span class="found">✓ Az idővonal összeállt</span><p class="typed">${esc(CLUES.alibi.x)}</p>`:`<div class="row"><button class="btn" id="alTry">Ellenőrzöm</button></div><p class="msg" id="alMsg"></p>`}`},
 cipher(){const done=S.solved.cipher;const k=done?SHIFT:S.dial;
  return `<h3>✦ ${PUZZLES.cipher}</h3>
  <p>Bakos Ilona kis dolgozószobájában, a gépelt levelek alatt egy zsebnaptár. Az október 9-i oldalon egyetlen értelmetlen sor áll. Úgy tűnik, minden betűt ugyanannyival tolt el az ábécében. Forgasd a tárcsát, amíg a szöveg értelmet nyer.</p>
  <div class="typed cipher">${CIPHER}</div>
  <div class="dial"><button class="btn ghost" id="dm" aria-label="Eltolás csökkentése" ${done?"disabled":""}>−</button><span class="num" id="dn">${k}</span><button class="btn ghost" id="dp" aria-label="Eltolás növelése" ${done?"disabled":""}>+</button>
  <input type="range" id="dr" min="0" max="25" value="${k}" aria-label="Eltolás" ${done?"disabled":""}></div>
  <div class="typed cipher" id="dout">${shiftTxt(CIPHER,-k)}</div>
  ${done?`<span class="found">✓ Megfejtve</span><p class="typed">${esc(CLUES.jegyzet.x)}</p>`:`<div class="row"><button class="btn" id="cTry">Megvan!</button></div><p class="msg" id="cMsg"></p>`}`}
};

function vGyan(){return `<div class="stack"><span class="eyebrow">Kihallgatási jegyzőkönyvek</span><h2>Gyanúsítottak</h2>
 <p>Mindenki mond valamit — és mindenki elhallgat valamit. Újabb nyomok után a jegyzetek bővülnek.</p>
 <div class="grid2">${SUSPECTS.map(s=>{const ex=s.extra&&(S.solved[s.extra.after]||S.clues.includes(s.extra.after));
  return `<div class="suspect">${ex&&s.extra.lie?`<span class="stamp anim">Hazudott</span>`:""}<h3>${s.name}</h3><span class="role">${s.role}</span><p>${s.stmt}</p>${ex?`<p class="note">${s.extra.text}</p>`:""}</div>`}).join("")}</div></div>`}

function vJegy(){const ids=Object.keys(CLUES).filter(k=>S.clues.includes(k));
 return `<div class="stack"><span class="eyebrow">Saját jegyzeteid</span><h2>Jegyzetfüzet</h2>${progressPips()}
 ${ids.length?`<div class="stack">${ids.map(k=>`<div class="clue"><span class="src">${CLUES[k].src}</span><h3>${CLUES[k].t}</h3><p>${esc(CLUES[k].x)}</p></div>`).join("")}</div>`
 :`<p class="typed">Még üres a füzet. Kezdd a könyvtárral: ott történt a gyilkosság.</p>`}
 <p class="eyebrow">${ids.length} / ${Object.keys(CLUES).length} nyom</p></div>`}

const MOTIVES=["Az örökség megszerzése","Féltékenység, megcsalt házasság","A festményhamisítás leleplezésének megakadályozása","Felhalmozott kártyaadósság"];
const MEANS=["Morfium az orvosi táskából","Cián az üvegházi darázsirtóból","Altató Matild éjjeliszekrényéről"];
function vVad(){
 if(S.ended==="win")return ending();
 const n=Object.keys(PUZZLES).filter(k=>S.solved[k]).length;
 return `<div class="stack"><span class="eyebrow">A szalonban mindenki rád vár</span><h2>Vádemelés</h2>
 <p>Ahogy a nagy detektívek szokták: összehívod a ház lakóit, és elmondod, mi történt. Nevezd meg a tettest, az eszközt és az indítékot.</p>
 ${n<4?`<p class="msg bad">Még ${4-n} rejtvény megoldatlan. Vádolhatsz most is, de kockázatos.</p>`:""}
 <fieldset><legend>Ki a gyilkos?</legend>${SUSPECTS.map(s=>`<label class="opt"><input type="radio" name="who" value="${s.id}"> ${s.name}</label>`).join("")}</fieldset>
 <fieldset><legend>Mivel ölt?</legend>${MEANS.map((m,i)=>`<label class="opt"><input type="radio" name="how" value="${i}"> ${m}</label>`).join("")}</fieldset>
 <fieldset><legend>Miért?</legend>${MOTIVES.map((m,i)=>`<label class="opt"><input type="radio" name="why" value="${i}"> ${m}</label>`).join("")}</fieldset>
 <div class="row"><button class="btn" id="accuse">Kimondom a nevet</button></div><div id="accMsg" class="msg"></div></div>`}

function ending(){return `<div class="stack"><div class="ending win"><span class="stamp anim" style="align-self:flex-start">Ügy lezárva</span>
 <h2>Bakos Ilona volt az.</h2>
 <p>Négy éven át Ilona kezelte a báró gyűjteményének papírjait. Lassan, képről képre cserélte az eredetieket ügyes hamisítványokra, az eredetieket pedig eladta, a nyugtákat a saját Remingtonján gépelve.</p>
 <p>A báró rájött a csalásra, és levelet írt a rendőrségnek: másnap meg akarta nevezni a tettest. Ilona tudta, hogy csak egy estéje maradt. Délután elvette a cianidot az üvegház harmadik polcáról, este pedig, amíg a báró a hallban telefonált, a könyvtárba lopózott és a konyakba szórta. Azt hazudta, hogy fent gépelt, de Matild egész este egyetlen kopogást sem hallott.</p>
 <p>A titkosított jegyzet, a hamis nyugta és a hazug alibi együtt döntötte el az ügyet. Dr. Szirmai morfiuma, Gábor adósságai és Matild levele csak a ház többi titka voltak.</p>
 <p class="eyebrow">Megoldva ${S.tries} próbálkozásból · ${S.clues.length}/${Object.keys(CLUES).length} nyom</p></div>
 <div class="row"><button class="btn ghost" id="again">Újrajátszom</button></div></div>`}

const bind={
 ugy(){document.querySelector("[data-go]").onclick=()=>{S.tab="hely";save();render()}},
 hely(){
  document.querySelectorAll("[data-loc]").forEach(b=>b.onclick=()=>{S.loc=b.dataset.loc;save();render();window.scrollTo({top:0})});
  const bk=$("[data-back]");if(bk)bk.onclick=()=>{S.loc=null;save();render()};
  document.querySelectorAll("[data-take]").forEach(b=>b.onclick=()=>{gain(b.dataset.take);save();render()});
  // desk
  const d=[0,1,2,3].map(i=>$("#d"+i));
  if(d[0]){d.forEach((el,i)=>{el.oninput=()=>{el.value=el.value.replace(/\D/g,"").slice(-1);if(el.value&&d[i+1])d[i+1].focus()};
     el.onkeydown=e=>{if(e.key==="Backspace"&&!el.value&&d[i-1])d[i-1].focus();if(e.key==="Enter")$("#deskTry").click()}});
   $("#deskTry").onclick=()=>{const c=d.map(x=>x.value).join("");const m=$("#deskMsg");
     if(c==="1405"||c==="0514"){solve("desk","level");gain("level");save();render()}
     else{m.className="msg bad";m.textContent=c.length<4?"Négy számjegy kell.":"A zár nem enged. Kattan, de nem nyílik."}};
   $("#deskHint").onclick=()=>{const m=$("#deskMsg");m.className="msg";m.textContent="Súgó: a római szám a hónapot jelöli. Próbáld nap, aztán hónap sorrendben, két-két jeggyel."}}
  // typewriter
  if($("#twTry"))$("#twTry").onclick=()=>{const v=(document.querySelector("input[name=tw]:checked")||{}).value;const m=$("#twMsg");
    if(!v){m.className="msg bad";m.textContent="Előbb válassz egy gépet.";return}
    if(v==="C"){solve("type","gep");render()}else{m.className="msg bad";m.textContent=v==="A"?"Az „é” hibája stimmel, de nézd meg az „a” betűket is.":"A felcsúszó „a” stimmel, de mi a helyzet az ékezetes „é”-vel?"}};
  // alibi
  document.querySelectorAll("[data-al]").forEach(s=>s.onchange=()=>{S.alibi[s.dataset.al]=s.value;save()});
  if($("#alTry"))$("#alTry").onclick=()=>{const ans={lukacs:"Konyha",szirmai:"Üvegház",gabor:"Szalon",matild:"Emeleti szobák",ilona:"Könyvtár"};
    const m=$("#alMsg");const vals=Object.values(S.alibi).filter(Boolean);
    if(SUSPECTS.some(s=>!S.alibi[s.id])){m.className="msg bad";m.textContent="Mindenkinek adj meg egy helyiséget.";return}
    if(new Set(vals).size<5){m.className="msg bad";m.textContent="Mindenki más helyiségben volt — egy szobába csak egy ember kerülhet.";return}
    const ok=SUSPECTS.filter(s=>S.alibi[s.id]===ans[s.id]).length;
    if(ok===5){solve("alibi","alibi");render()}else{m.className="msg bad";m.textContent=`${ok} / 5 helyes. Olvasd újra a vallomásokat.`}};
  // cipher
  const dr=$("#dr");
  if(dr&&!S.solved.cipher){const upd=k=>{S.dial=(k+26)%26;dr.value=S.dial;$("#dn").textContent=S.dial;$("#dout").textContent=shiftTxt(CIPHER,-S.dial);save()};
   dr.oninput=()=>upd(+dr.value);$("#dm").onclick=()=>upd(S.dial-1);$("#dp").onclick=()=>upd(S.dial+1);
   $("#cTry").onclick=()=>{if(S.dial===SHIFT){solve("cipher","jegyzet");render()}else{const m=$("#cMsg");m.className="msg bad";m.textContent="Ez még mindig zagyvaság. Forgasd tovább."}}}
 },
 vad(){
  if($("#again")){$("#again").onclick=reset;return}
  $("#accuse").onclick=()=>{const g=n=>(document.querySelector(`input[name=${n}]:checked`)||{}).value;
   const who=g("who"),how=g("how"),why=g("why");const m=$("#accMsg");
   if(!who||how===undefined||why===undefined){m.className="msg bad";m.textContent="Mindhárom kérdésre válaszolnod kell.";return}
   S.tries++;
   if(who==="ilona"&&how==="1"&&why==="2"){S.ended="win";save();render();window.scrollTo({top:0});return}
   save();m.className="msg bad";
   const wrong=[who!=="ilona"&&"a tettes",how!=="1"&&"az eszköz",why!=="2"&&"az indíték"].filter(Boolean);
   m.textContent=wrong.length===3?"Néma csend. A vádlott felnevet. Semmi sem stimmel.":`A vádlott ügyvédje közbevág: ${wrong.join(" és ")} nem áll meg. Gondold át újra.`}
 }
};
function reset(){S=fresh();save();render();window.scrollTo({top:0})}
$("#reset").onclick=reset;
render();
</script>
</body>
</html>
